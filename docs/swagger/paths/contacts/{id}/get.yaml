tags:
  - Contacts
summary: Get contact by id
description: Get contact by id
operationId: getContactById
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    description: ID of contact to return
    required: true
    schema:
      type: string
      format: int64
    example: 1
responses:
  '200':
    description: successful operation
    content:
      application/json:
        schema:
          type: object
          required:
            - stutus
            - message
            - data
          properties:
            stutus:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contact with id 1'
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '404':
    description: contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - stutus
            - message
          properties:
            stutus:
              type: integer
              example: 404
            message:
              type: string
              example: 'Contact with id 1 not found'
