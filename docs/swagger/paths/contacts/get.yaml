tags:
  - Contacts
summary: Get contact
description: Retrieves a list of all contacts from the phonebook.
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
    example: 1
  - name: perPage
    in: query
    schema:
      type: integer
    example: 10
  - name: sortBy
    in: query
    schema:
      type: string
    example: name
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
    example: asc

responses:
  '200':
    description: successful operation
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            stutus:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts!'
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 10
                totalPages:
                  type: number
                  example: 1
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: false
  '404':
    description: contacts not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            stutus:
              type: integer
              example: 404
            message:
              type: string
              example: 'Not found'
